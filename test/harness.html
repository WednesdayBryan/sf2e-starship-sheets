<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Starship Sheets Test</title>
<link rel="stylesheet" href="../sf2e-starship-sheets/styles/starship.css">
<style>
  body { background: #222; color: #ddd; font-family: sans-serif; margin: 0; padding: 12px; }
  #results { font-family: monospace; white-space: pre-wrap; background: #111; padding: 8px; margin-bottom: 12px; }
  .pass { color: #6f6; } .fail { color: #f66; font-weight: bold; }
  .frame { width: 900px; margin-bottom: 20px; border: 1px solid #555; }
  .action-glyph { font-family: monospace; border: 1px solid #888; padding: 0 2px; font-size: 10px; }
</style>
</head>
<body>
<div id="results"></div>
<div class="sf2e-starship-sheets frame" id="pc"><div class="window-content"></div></div>
<div class="sf2e-starship-sheets frame" id="npc"><div class="window-content"></div></div>
<script type="module">
import { defaultPCShip, derivePCShip, applyShipDamage, applyHullRepair, hullIntegrity, generateShieldsDice, ventPowerDice, vehicleSync, cosmicSpell, cantripRank, npcWeapon, tokenFacesLeft, predicateTest, weaponRollOptions, helmerRank, specializationBonus, attackFromBehind } from "../sf2e-starship-sheets/scripts/logic.mjs";
import { renderPCSheet, renderNPCSheet } from "../sf2e-starship-sheets/scripts/render.mjs";

const out = [];
let failures = 0;
const eq = (label, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) failures++;
  out.push(`<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${label}: got ${JSON.stringify(got)}${ok ? "" : `, want ${JSON.stringify(want)}`}`);
};

// The group's ship from the AoN builder link: level 6 Skirmisher.
const ship = defaultPCShip("skirmisher", 6);
const set = (i, props) => Object.assign(ship.stations[i], props);
set(0, { upgrades: ["powerful-thrusters", "ramming-prow"], helmer: "pilot" });
set(1, { upgrades: ["primal-shielding", "mechanic-generator-module"] });
set(2, { type: "gunnery", upgrades: ["starship-weapon-crystal", "secondary-armaments"], weapons: [{ key: "farseeker-missiles" }, { key: "light-laser-cannon" }], helmer: "gunner" });
set(3, { type: "conduit", upgrades: ["mystic-magic-module", "witchwarper-magic-module"], helmer: "mystic" });
set(4, { type: "scanners", upgrades: ["communications-overlay", "security-relay"], helmer: "scanner" });
set(5, { type: "gunnery", upgrades: ["secondary-armaments", "munitions-deflection-unit"], weapons: [{ key: "light-laser-cannon" }, { key: "chain-repeater" }] });
ship.bays[0] = { name: "Medical Bay", notes: "Treat Wounds +1" };

const crew = {
  pilot: { name: "Asha (pilot)", pilotDC: 24, dex: 4, level: 6, ranks: { simple: 1, martial: 1, advanced: 0 } },
  gunner: { name: "Grix (gunner)", pilotDC: 18, dex: 4, level: 6, str: 4, attunement: "photon", classDC: 21, ranks: { simple: 2, martial: 1, advanced: 0 },
    solarWeapon: { label: "Advanced Solar Weapon (Photon)", variants: ["+14", "+9", "+4"], attack: 14, agile: false, reach: true, die: "d8", dice: 2, type: "slashing" }, solarFlare: { attack: 12, dice: 2 } },
  scanner: { name: "Zo (scanners)", pilotDC: 15, dex: 2, level: 6, ranks: { simple: 1, martial: 0, advanced: 0 } },
  mystic: { name: "Vesk (mystic)", pilotDC: 12, dex: 1, level: 6, spellAttack: 14, vitality: { value: 18, max: 30, cap: 20, regen: 4 }, ranks: { simple: 1, martial: 0, advanced: 0 } }
};

// NPC starship weapons vs Tech Core stat blocks
const npcW = (key, level, attackTier, damageTier) => { const w = npcWeapon({ key, attackTier, damageTier }, level); return [w.attack, w.formula]; };
eq("Sword-class (level 2) coilgun, high attack / low damage = +11, 1d6+3", npcW("coilgun", 2, "high", "low"), [11, "1d6+3"]);
eq("Raider Trident (level -1) scrap-launcher-like d6, moderate/moderate = +6, 1d6", npcW("coilgun", -1, "moderate", "moderate"), [6, "1d6"]);
eq("Defaults: high attack, moderate damage (level 6 laser) = +17, 2d8+6", npcW("light-laser-cannon", 6), [17, "2d8+6"]);
eq("Level 12 uses 3 dice (artillery cannon, high) = +26, 3d10+14", npcW("artillery-cannon", 12, "high", "high"), [26, "3d10+14"]);
eq("Level 20 extreme magnetar rail = +40, 4d10+36", npcW("magnetar-rail", 20, "extreme", "extreme"), [40, "4d10+36"]);
eq("Agile weapon MAP", npcWeapon({ key: "coilgun" }, 2).map, [0, -4, -8]);
eq("Party ship: 0 faces right, 180 faces left", [tokenFacesLeft("pc", 0), tokenFacesLeft("pc", 180)], [false, true]);
eq("NPC ship: 0 faces left, 180 faces right", [tokenFacesLeft("npc", 0), tokenFacesLeft("npc", 180)], [true, false]);
eq("Art faces left inverts", [tokenFacesLeft("pc", 0, true), tokenFacesLeft("npc", 0, true)], [true, false]);
eq("Old text headings count as 0", tokenFacesLeft("pc", "east"), false);
eq("Cantrip rank at level 6", cantripRank(6), 3);
// Operative guns: ranged simple/martial (or advanced) weapons with the analog or tech trait
const GUNS = ["item:ranged", { or: ["item:category:martial", "item:category:simple"] }, { or: ["item:trait:analog", "item:trait:tech"] }];
const ADV_GUNS = ["item:ranged", "item:category:advanced", { or: ["item:trait:analog", "item:trait:tech"] }];
const op = { level: 7, dex: 4, ranks: { simple: 1, martial: 1, advanced: 0 }, specialization: "normal",
  customAttacks: [{ slug: "martial-simple-guns", rank: 3, definition: GUNS }, { slug: "advanced-guns", rank: 2, definition: ADV_GUNS }] };
eq("Light laser cannon (simple, tech) counts as a gun", predicateTest(GUNS, weaponRollOptions({ category: "simple", group: "Laser", traits: ["Tech"], range: 5 })), true);
eq("Chain repeater (martial, analog) counts as a gun", predicateTest(GUNS, weaponRollOptions({ category: "martial", group: "Projectile", traits: ["Analog", "Automatic"], range: 2 })), true);
eq("Polarizing beam (no analog/tech) isn't a gun", predicateTest(GUNS, weaponRollOptions({ category: "martial", group: "Shock", traits: ["Boost 1d8", "Ordnance"], range: 2 })), false);
eq("Operative ranks: laser master, gravity cannon (advanced) expert, polarizing beam trained", [
  helmerRank(op, { category: "simple", group: "Laser", traits: ["Tech"], range: 5 }),
  helmerRank(op, { category: "advanced", group: "Shock", traits: ["Area (line)", "Ordnance", "Tech"], range: 5 }),
  helmerRank(op, { category: "martial", group: "Shock", traits: ["Boost 1d8", "Ordnance"], range: 2 })], [3, 2, 1]);
eq("Weapon specialization: master +3, greater legendary +8, trained 0", [specializationBonus(op, 3), specializationBonus({ specialization: "greater" }, 4), specializationBonus(op, 1)], [3, 8, 0]);
eq("Predicate gte against a numeric roll option", predicateTest([{ gte: ["item:proficiency:rank", 2] }], ["item:proficiency:rank:3"]), true);
eq("Cosmic Cannon rank 1 / 3", [cosmicSpell(504, 1).formula, cosmicSpell(504, 3).formula], ["2d4", "4d4"]);
eq("Cosmic Bombardment rank 1, 3 actions", cosmicSpell(503, 1, 3).formula, "3d4+3");
eq("Cosmic Bombardment rank 3, 2 actions (2 missiles per action)", cosmicSpell(503, 3, 2).formula, "4d4+4");
eq("Cosmic Fortification rank 2", cosmicSpell(505, 2).formula, "2d4+8");
eq("Cosmic Repairs rank 3", cosmicSpell(506, 3).formula, "3d8+24");

// Unhelmed: must match the AoN builder exactly.
const bare = structuredClone(ship);
bare.stations.forEach((s) => (s.helmer = ""));
const b = derivePCShip(bare, {});
eq("Frame HP", b.hpMax, 78);
eq("Frame SP", b.spMax, 34);
eq("AC unhelmed", b.ac.total, 22);
eq("Saves unhelmed", [b.saves.fortitude.total, b.saves.reflex.total, b.saves.will.total], [14, 15, 14]);
eq("Speed", b.speed, 5);
eq("Sensor range (4 + advanced scanners 2)", b.sensor.total, 6);
eq("Station grades", b.stations.map((s) => s.gradeLabel), ["Advanced", "Advanced", "Advanced", "Advanced", "Advanced", "Advanced"]);
eq("Pilot upgrades allowed", b.stations[0].upgradesAllowed, 2);
eq("No warnings", b.warnings, []);
eq("Gunnery weapon formulas", b.stations[2].weaponsView.map((w) => w.formula), ["2d8", "2d8"]);
eq("Tracking", b.stations[2].weaponsView[0].tracking, 1);
eq("Pilot actions (no Jump Start)", b.stations[0].actions.map((a) => a.name), ["Boost Thrusters", "Change Heading", "Evade", "Juke", "Stick To Cover", "Clear A Path", "Smoke And Mirrors", "Uncanny Turn", "Overload Thrusters", "Ram", "Repair Station"]);
const act = (si, name) => b.stations[si].actions.find((a) => a.name === name)?.check;
eq("Juke: Piloting vs Perception DC", act(0, "Juke"), { skills: ["piloting"], vs: "perception", dc: null, secret: false });
eq("Ram: target Fortitude vs Piloting DC", act(0, "Ram"), { save: "fortitude", basic: true, dcSkill: "piloting", dcClass: false });
eq("Jump Start at generator: Crafting DC 15", act(1, "Jump Start"), { skills: ["crafting"], dc: 15, vs: null, secret: false });
eq("Jump Start at conduit: four skills", act(3, "Jump Start").skills, ["arcana", "occultism", "nature", "religion"]);
eq("Scan Target: Computers vs Will DC", act(4, "Scan Target"), { skills: ["computers"], vs: "will", dc: null, secret: false });
eq("Seek Starships is secret", act(4, "Seek Starships").secret, true);
eq("Target Lock: target Will vs Computers DC", act(4, "Target Lock").save, "will");
eq("Lock On has no roll", act(2, "Lock On"), null);
eq("Repair Drone's Repair Hull: Crafting DC 15", b.stations.length && derivePCShip({ ...bare, stations: [...bare.stations.slice(0, 5), { ...bare.stations[5], type: "drone", upgrades: [], weapons: [] }] }, {}).stations[5].drones[1].actionList[0].check.dc, 15);
eq("Generator actions", b.stations[1].actions.map((a) => a.name), ["Boost Battle Station", "Generate Shields", "Reposition Shield", "Vent Power", "Shielding Foliage", "Modify Starship", "Jump Start", "Repair Station"]);
eq("Gunnery 1 actions", b.stations[2].actions.map((a) => a.name), ["Lock On", "Target Battle Station", "Nova Weapon", "Nova Strike", "Nova Blast", "Nova Surge", "Repair Station", "Area Fire"]);
eq("Gunnery 2 actions include Deflect Munitions and Auto-Fire", ["Deflect Munitions", "Auto-Fire"].every((n) => b.stations[5].actions.some((a) => a.name === n)), true);
eq("Scanner actions", b.stations[4].actions.map((a) => a.name), ["Hack Comms", "Seek Starships", "Target Lock", "Hack Battle Station", "Scan Target", "Hack Munition", "Security Scan", "Jump Start", "Repair Station"]);

// Helmed
const d = derivePCShip(ship, crew);
eq("AC with pilot DC 24 + advanced helm +1", d.ac.total, 25);
eq("Reflex with advanced pilot (+0)", d.saves.reflex.total, 15);
eq("Gunner attack: dex 4 + martial trained (6+2) + tracking 1", d.stations[2].weaponsView[0].attack, 13);
eq("Laser (simple, expert): 4 + 6 + 4 + 1", d.stations[2].weaponsView[1].attack, 15);
eq("Unhelmed gunnery has no attack", d.stations[5].weaponsView[0].attack, null);
eq("Chain repeater MAP", d.stations[5].weaponsView[1].map, [0, -5, -10]);

// Damage rules
let s = { hp: 78, hpMax: 78, sp: 34, compromised: 0, wrecked: 0, destroyed: false };
let r = applyShipDamage(s, { amount: 40 });
eq("40 damage: SP 0, HP 72", [r.sp, r.hp, r.compromised], [0, 72, 0]);
r = applyShipDamage({ ...s, sp: 10 }, { amount: 30, bypass: true });
eq("Bypassing skips shields", [r.sp, r.hp], [10, 48]);
r = applyShipDamage({ ...s, hp: 10, sp: 0, wrecked: 1 }, { amount: 50 });
eq("Drop to 0 while wrecked 1: compromised 2, stations malfunction", [r.hp, r.compromised, r.malfunctionAll], [0, 2, true]);
r = applyShipDamage({ ...s, hp: 10, sp: 0 }, { amount: 50, critical: true });
eq("Crit to 0: compromised 2", r.compromised, 2);
r = applyShipDamage({ ...s, hp: 0, sp: 0, compromised: 3 }, { amount: 5 });
eq("Damage while compromised: +1", r.compromised, 4);
r = applyShipDamage({ ...s, hp: 0, sp: 0, compromised: 9 }, { amount: 5, critical: true });
eq("Compromised 10 destroys", [r.compromised, r.destroyed], [10, true]);
r = applyHullRepair({ ...s, hp: 0, compromised: 4, wrecked: 1 }, 5);
eq("Repair from 0: compromised ends, wrecked 2", [r.hp, r.compromised, r.wrecked], [5, 0, 2]);
eq("Hull integrity nat 20 at compromised 3", hullIntegrity(3, 20).compromised, 1);
eq("Hull integrity 13 at compromised 3 (success)", hullIntegrity(3, 13).compromised, 2);
eq("Hull integrity 5 at compromised 3 (failure)", hullIntegrity(3, 5).compromised, 4);
eq("Hull integrity 1 at compromised 3 (crit fail)", hullIntegrity(3, 1).compromised, 5);
eq("Generate Shields dice by level 1/3/6/20", [1, 3, 6, 20].map(generateShieldsDice), [1, 2, 3, 10]);
eq("Vent Power dice by level 5/6/8", [5, 6, 8].map(ventPowerDice), [1, 2, 3]);
eq("Vehicle sync", vehicleSync(d, 90), {
  "system.details.level.value": 6, "system.attributes.hp.max": 78, "system.attributes.hp.value": 78,
  "system.attributes.ac.value": 25, "system.saves.fortitude.value": 14, "system.details.speed": "5 zones", "system.traits.size.value": "med"
});

// Warnings
const bad = structuredClone(bare);
bad.stations[0].upgrades.push("solar-thrusters");
bad.stations[1].upgrades.push("coilgun");
eq("Too many upgrades warns", derivePCShip(bad, {}).warnings.some((w) => w.includes("3 upgrades")), true);

out.unshift(failures ? `<span class="fail">${failures} FAILED</span>` : `<span class="pass">ALL PASSED</span>`);
document.getElementById("results").innerHTML = out.join("\n");

// Render the PC sheet
document.querySelector("#pc .window-content").innerHTML = renderPCSheet({
  name: "The Starfinder Skirmisher", img: "", editable: true, ship, derived: d,
  hp: { value: 72, max: 78 }, hpField: "system.attributes.hp.value",
  crewOptions: Object.entries(crew).map(([uuid, c]) => ({ uuid, name: c.name })), tab: "stations"
});

// Render an NPC sheet (Sword-class Attack Vessel)
const npcShip = { kind: "npc", sp: 6, spMax: 6, fortify: 5, acCircumstance: 1, sensor: 4, speed: 4, compromised: 0, wrecked: 0, destroyed: false, heading: "west", notes: "",
  stations: [{ type: "gunnery", name: "coilgun, light laser cannon", malfunctioning: false }, { type: "pilot", name: "Ambush from Hell, Boost Thrusters, Change Heading, ramming prow", malfunctioning: true },
    { type: "generator", name: "", malfunctioning: false }, { type: "conduit", name: "", malfunctioning: false }], spellTier: "high" };
window.__renderNPC = (over) => renderNPCSheet({ ...window.__npcVM, ship: { ...window.__npcVM.ship, ...over } });
document.querySelector("#npc .window-content").innerHTML = renderNPCSheet(window.__npcVM = {
  name: "Sword-class Attack Vessel", img: "", editable: true, isGM: true, ship: npcShip, level: 2, size: "Medium", traits: ["Tech"],
  ac: 17, pilotingDC: 17, saves: { fortitude: 9, reflex: 9, will: 5 }, perception: 7,
  skills: [{ slug: "computers", label: "Computers", mod: 7 }, { slug: "intimidation", label: "Intimidation", mod: 8 }, { slug: "piloting", label: "Piloting", mod: 7 }],
  abilities: [["Str", 1], ["Dex", 3], ["Con", 2], ["Int", 3], ["Wis", 1], ["Cha", 2]].map(([label, mod]) => ({ label, mod })),
  immunities: "starship immunities", resistances: "piercing 4", weaknesses: "",
  hp: { value: 30, max: 30 }, hpField: "system.attributes.hp.value",
  strikes: [
    { index: 0, label: "Ramming Prow", kind: "Melee", variants: ["+9", "+4", "-1"], damage: "1d6+3 piercing", traits: ["Analog"] },
    { index: 1, label: "Coilgun", kind: "Ranged", variants: ["+11", "+7", "+3"], damage: "1d6+3 piercing", traits: ["Agile", "Analog", "Range increment 3 zones"] }
  ],
  actions: [
    { id: "a1", name: "Ambush from Hell", cost: 2, traits: [], station: "pilot" },
    { id: "a2", name: "Engaged Strike", cost: "r", traits: [], station: "gunnery" },
    { id: "a3", name: "Repair Self", cost: 1, traits: [], station: "other" }
  ],
  weapons: [npcWeapon({ key: "coilgun", attackTier: "high", damageTier: "low" }, 2, 0), npcWeapon({ key: "farseeker-missiles" }, 2, 1)],
  tab: "combat"
});
const npcEl = document.querySelector("#npc");
eq("NPC sheet weapon attack buttons", [...npcEl.querySelectorAll('[data-action="npcWeaponStrike"][data-weapon="0"]')].map((b) => b.textContent), ["+11", "+7", "+3"]);
eq("NPC area weapon (farseeker): no Strike buttons, Area Fire DC 18 (level 2, High) and area damage", [npcEl.querySelectorAll('[data-action="npcWeaponStrike"][data-weapon="1"]').length, npcEl.querySelector('[data-action="npcAreaFire"][data-weapon="1"]').textContent.trim().replace(/^\S+\s*/, ""), npcEl.querySelector('[data-action="npcWeaponDamage"][data-weapon="1"]').textContent.trim()], [0, "Area Fire DC 18", "1d8+4 piercing"]);
eq("NPC sheet tier dropdowns", [npcEl.querySelector('[name="ship.weapons.0.attackTier"]').value, npcEl.querySelector('[name="ship.weapons.0.damageTier"]').value], ["high", "low"]);
const headingText = (sel) => [...document.querySelector(`${sel} [name="ship.heading"]`).options].map((o) => o.textContent.trim());
eq("Party heading dropdown", headingText("#pc"), ["0° → left to right", "180° ← right to left"]);
eq("NPC heading dropdown", headingText("#npc"), ["0° ← right to left", "180° → left to right"]);
eq("NPC AC shows Evade +1 (17 + 1 = 18)", [document.querySelector("#npc .sss-ac-value").textContent.trim(), document.querySelector('#npc [name="ship.acCircumstance"]').value], ["18", "1"]);
eq("NPC Evade and Stick to Cover have AC buttons", [...document.querySelectorAll('#npc [data-action="npcSetEvade"]')].map((b) => b.textContent.trim()), ["AC +1", "AC +2", "AC +1"]);
const conduitRow = [...document.querySelectorAll("#npc .sss-npc-station")].find((li) => li.querySelector("select").value === "conduit");
eq("NPC conduit: Cosmic Cannon attacks from level 2 High (+10) and rank 1 damage", [[...conduitRow.querySelectorAll('[data-action="npcSpellAttack"]')].map((b) => b.textContent), conduitRow.querySelector('[data-action="npcSpellDamage"]').textContent.trim()], [["+10", "+5", "+0"], "2d4 force"]);
eq("NPC conduit: Cast for Bombardment, Fortification, Repairs", [...conduitRow.querySelectorAll('[data-action="npcCastSpell"]')].map((b) => b.dataset.spell), ["503", "505", "506"]);
eq("Add-weapon picker lists 17 weapons + breaching ram", npcEl.querySelectorAll('[data-action-change="addNPCWeapon"] option').length, 19);
const ram = npcWeapon({ key: "breaching-ram", attackTier: "moderate", damageTier: "high" }, 3);
eq("Jinsul Breacher (level 3) breaching ram = +10, 1d10+6 piercing, melee", [ram.attack, ram.formula, ram.type, ram.range], [10, "1d10+6", "piercing", 0]);
const stationRow = (type) => [...npcEl.querySelectorAll(".sss-npc-station")].find((li) => li.querySelector("select").value === type);
eq("Pilot's console lists its common actions", [...stationRow("pilot").querySelectorAll('[data-action="npcCommonAction"]')].map((b) => b.textContent.trim().replace(/^\S+\s*/, "").replace(/^\S+–\S+\s*/, "")),
  ["Boost Thrusters", "Change Heading", "Evade", "Stick to Cover"]);
eq("Pilot actions link to AoN common actions", stationRow("pilot").querySelector("a.sss-link").getAttribute("href"), "https://2e.aonsrd.com/rules/1423-common-actions-and-features");
eq("Malfunctioning pilot's console greys its actions", stationRow("pilot").querySelectorAll(".sss-action.is-disabled").length, 4);
eq("Generator: Fortify Shield Points +5 SP and Tractor Beam", [stationRow("generator").querySelector('[data-action="npcFortify"]').textContent.trim(), stationRow("generator").textContent.includes("Tractor Beam")], ["+5 SP", true]);
eq("Gunnery: Engaged Strike", stationRow("gunnery").textContent.includes("Engaged Strike"), true);
eq("Default actions: Repair Self (+2 HP) and Seek Starships (Perception +7)", [npcEl.querySelector('[data-action="npcRepairSelf"]').textContent.trim(), npcEl.querySelector('.sss-npc-actions [data-action="rollPerception"]').textContent.trim()],
  ["+2 HP, fix a station", "Perception +7"]);
out[0] = failures ? `<span class="fail">${failures} FAILED</span>` : `<span class="pass">ALL PASSED</span>`;
document.getElementById("results").innerHTML = out.join("\n");

// Load main.mjs against minimal Foundry stand-ins: proves it parses and registers.
const registered = [];
Math.clamp ??= (n, lo, hi) => Math.min(Math.max(n, lo), hi); // Foundry adds this helper
globalThis.foundry = {
  applications: {
    sheets: { ActorSheetV2: class {} },
    api: { DialogV2: {}, ApplicationV2: class {} },
    apps: { DocumentSheetConfig: { registerSheet: (...a) => registered.push(a[3].label) } },
    instances: new Map()
  },
  utils: { deepClone: (o) => structuredClone(o), mergeObject: Object.assign, setProperty() {}, getProperty() {}, expandObject: (o) => o }
};
const hooks = {};
globalThis.Hooks = { once: (n, f) => (hooks[n] = f), on: () => {} };
globalThis.game = { system: { id: "sf2e" }, settings: { register() {} }, modules: new Map([["sf2e-starship-sheets", {}]]) };
globalThis.Actor = class {};
try {
  const main = await import("../sf2e-starship-sheets/scripts/main.mjs");
  hooks.init();
  document.getElementById("results").innerHTML += `\n<span class="pass">PASS</span> main.mjs loaded and registered: ${registered.join(", ")}`;

  // Portrait / token image updates
  const tokenUpdates = [];
  globalThis.canvas = { scene: { tokens: [{ id: "t1", actorId: "a1", actorLink: true, isOwner: true }, { id: "t2", actorId: "other", actorLink: true, isOwner: true }],
    updateEmbeddedDocuments: async (type, u) => tokenUpdates.push(...u) } };
  const mockActor = (img, tokenSrc) => ({ id: "a1", img, prototypeToken: { actorLink: true, texture: { src: tokenSrc } }, updates: [], async update(u) { this.updates.push(u); } });
  const check = (label, got, want) => {
    const ok = JSON.stringify(got) === JSON.stringify(want);
    document.getElementById("results").innerHTML += `\n<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${label}: got ${JSON.stringify(got)}${ok ? "" : `, want ${JSON.stringify(want)}`}`;
  };
  let a = mockActor("icons/svg/target.svg", "icons/svg/target.svg");
  await main.setImage(a, "ships/skirmisher.webp", "img");
  check("Portrait also sets matching token + placed token", [a.updates[0], tokenUpdates], [{ img: "ships/skirmisher.webp", "prototypeToken.texture.src": "ships/skirmisher.webp" }, [{ _id: "t1", "texture.src": "ships/skirmisher.webp" }]]);
  a = mockActor("ships/old.webp", "tokens/custom.webp");
  tokenUpdates.length = 0;
  await main.setImage(a, "ships/new.webp", "img");
  check("Portrait leaves a custom token alone", [a.updates[0], tokenUpdates.length], [{ img: "ships/new.webp" }, 0]);
  await main.setImage(a, "tokens/top-down.webp", "token");
  check("Token button sets only the token", a.updates[1], { "prototypeToken.texture.src": "tokens/top-down.webp" });
  check("Token button is rendered", !!document.querySelector('#pc [data-action="editToken"]'), true);
  const rollBtns = [...document.querySelectorAll('#pc [data-action="rollActionCheck"]')].map((el) => `${el.closest("li").querySelector(".sss-action-name").textContent.trim().replace(/^\S+\s*/, "")}:${el.dataset.skill}`);

  check("Juke critical success: Off-Guard and Off-Kilter links", [chatPosts.length, chatPosts[0]?.includes("@UUID[Compendium.sf2e.conditions.Item.AJh5ex99aV6VTggg]{Off-Guard}"), chatPosts[0]?.includes("@UUID[Compendium.world.starship-conditions.Item.okilter]{Off-Kilter}"), chatPosts[0]?.includes("Raider is off-kilter and off-guard for 1 round")], [1, true, true, true]);
  jukeDegree = 2;
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.rollActionCheck.call(sheet, {}, jukeBtn);
  check("Juke success: Off-Guard only", [chatPosts.length, chatPosts[1]?.includes("{Off-Guard}"), chatPosts[1]?.includes("{Off-Kilter}")], [2, true, false]);
  jukeDegree = 1;
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.rollActionCheck.call(sheet, {}, jukeBtn);
  check("Juke failure: no condition card", chatPosts.length, 2);

  // The GM's client creates the Starship Conditions compendium with Off-Kilter once
  const created = [];
  let savedUuid = "";
  globalThis.game.user.id = "gm";
  globalThis.game.users = { activeGM: { id: "gm" } };
  globalThis.game.settings.get = () => savedUuid;
  globalThis.game.settings.set = async (m, k, v) => (savedUuid = v);
  globalThis.fromUuid = async () => null;
  globalThis.game.packs = { get: () => null };
  globalThis.foundry.documents = { collections: { CompendiumCollection: { createCompendium: async (meta) => (created.push(meta), { collection: `world.${meta.name}`, getIndex: async () => [] }) } } };
  globalThis.Item = { create: async (data, opts) => (created.push([data.name, data.type, data.system.slug, opts.pack, data.system.rules[0].selector]), { uuid: "Compendium.world.starship-conditions.Item.new1" }) };
  await main.ensureOffKilter();
  check("Off-Kilter is created in a Starship Conditions compendium", [created[0], created[1], savedUuid],
    [{ label: "Starship Conditions", name: "starship-conditions", type: "Item" }, ["Off-Kilter", "effect", "off-kilter", "world.starship-conditions", ["attack", "reflex"]], "Compendium.world.starship-conditions.Item.new1"]);

  // Change Heading reverses the heading, turns the tokens and ends off-kilter
  const hdShip = { kind: "npc", heading: 0, artFacesLeft: false, stations: [], effects: [{ label: "Off-kilter, −1 zone Speed for 1 round (graviton Nova Blast)", speed: -1, offKilter: true }] };
  const deleted = [];
  const hdUpdates = [];
  const hdActor = { id: "n1", isToken: false, type: "npc", flags: { "sf2e-starship-sheets": { ship: hdShip } }, prototypeToken: { texture: { scaleX: -1 } },
    itemTypes: { effect: [{ id: "e1", slug: "off-kilter" }, { id: "e2", slug: "effect-aim" }] },
    update: async (u) => {
      hdUpdates.push(u);
      if ("flags.sf2e-starship-sheets.ship.heading" in u) hdShip.heading = u["flags.sf2e-starship-sheets.ship.heading"];
      if ("flags.sf2e-starship-sheets.ship.effects" in u) hdShip.effects = u["flags.sf2e-starship-sheets.ship.effects"];
    },
    deleteEmbeddedDocuments: async (type, ids) => deleted.push(...ids) };
  globalThis.game.scenes = [];
  const said = await main.changeHeading(hdActor);
  check("Change Heading: NPC 0° → 180°, token turned to face right", [hdShip.heading, hdUpdates[1]?.["prototypeToken.texture.scaleX"]], [180, 1]);
  check("Change Heading removes the Off-Kilter effect only", deleted, ["e1"]);
  check("Change Heading keeps the Nova Blast Speed penalty but ends its off-kilter", hdShip.effects, [{ label: "−1 zone Speed for 1 round (graviton Nova Blast)", speed: -1, offKilter: false }]);
  check("Change Heading chat text", said, "Heading is now 180° (→ left to right); the starship is no longer off-kilter.");

  // Heading: attacks from behind treat the target as off-guard
  const L2 = await import("../sf2e-starship-sheets/scripts/logic.mjs");
  check("Behind: target heads left, attacker to its right", L2.attackFromBehind({ targetX: 400, attackerX: 700, targetHeadsLeft: true, zoneWidth: 100 }), true);
  check("Ahead: target heads left, attacker to its left", L2.attackFromBehind({ targetX: 400, attackerX: 100, targetHeadsLeft: true, zoneWidth: 100 }), false);
  check("Same zone always counts as ahead", L2.attackFromBehind({ targetX: 400, attackerX: 460, targetHeadsLeft: true, zoneWidth: 100 }), false);
  check("Target heading right is behind from the left", L2.attackFromBehind({ targetX: 400, attackerX: 100, targetHeadsLeft: false, zoneWidth: 100 }), true);
  globalThis.canvas = { grid: { size: 100 }, scene: { id: "s" } };
  globalThis.game.settings.get = (m, k) => (k === "zoneWidth" ? 1 : "");
  globalThis.fromUuidSync = (uuid) => (uuid === "effugy" ? effugy : null);
  const npcRaider = { type: "npc", name: "Raider", attributes: { ac: { value: 20 } }, hasCondition: () => false, flags: { "sf2e-starship-sheets": { ship: { kind: "npc", heading: 0 } } } };
  let attackerX = 700;
  effSheet.document = { ...effSheet.document, getActiveTokens: () => [{ center: { x: attackerX }, scene: { id: "s" } }] };
  globalThis.game.user.targets = new Set([{ actor: npcRaider, center: { x: 400 } }]);
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.strike.call(effSheet, {}, { dataset: { station: "5", weapon: "0", map: "0" } });
  check("Party ship firing from behind an NPC heading 0: AC 20 - 2", strikeLog.at(-1).includes("AC 18, off-guard: attacked from behind"), true);
  attackerX = 100;
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.strike.call(effSheet, {}, { dataset: { station: "5", weapon: "0", map: "0" } });
  check("Firing from ahead: normal AC 20", [strikeLog.at(-1).includes("(AC 20)"), strikeLog.at(-1).includes("behind")], [true, false]);
  npcRaider.hasCondition = (c) => c === "off-guard";
  attackerX = 700;
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.strike.call(effSheet, {}, { dataset: { station: "5", weapon: "0", map: "0" } });
  check("Already off-guard: no extra -2 from behind", strikeLog.at(-1).includes("(AC 20)"), true);

  // Magic conduit: leveled starship spells expend one of the caster's own slots
  const L3 = await import("../sf2e-starship-sheets/scripts/logic.mjs");
  const slotSrc = [
    { id: "p1", name: "Mystic Spells", mode: "prepared", slots: { 1: { value: 0, max: 2, prepared: [{ id: "s1", expended: false, name: "Heal" }, { id: null, expended: false }] }, 2: { value: 0, max: 1, prepared: [{ id: "s2", expended: true, name: "Fear" }] } } },
    { id: "sp1", name: "Witchwarper Spells", mode: "spontaneous", slots: { 1: { value: 0, max: 3, prepared: [] }, 2: { value: 2, max: 3, prepared: [] } } }
  ];
  check("Available slots: unused rank 1+ only, highest first", L3.availableSlots(slotSrc).map((o) => o.label),
    ["Rank 2 — Witchwarper Spells (2 of 3 left)", "Rank 1 — Mystic Spells: Heal"]);
  const slotLog = [];
  const caster = { name: "Vesk", uuid: "mystic", level: 6,
    itemTypes: { spellcastingEntry: [
      { id: "p1", name: "Mystic Spells", isPrepared: true, isSpontaneous: false, isFlexible: false, statistic: { check: { mod: 14 } },
        system: { slots: { slot1: { value: 0, max: 1, prepared: [{ id: "s1", expended: false }] } } }, setSlotExpendedState: async (...a) => (slotLog.push(["expend", ...a]), true) },
      { id: "sp1", name: "Witchwarper Spells", isPrepared: false, isSpontaneous: true, isFlexible: false, statistic: { check: { mod: 12 } },
        system: { slots: { slot2: { value: 2, max: 3, prepared: [] } } }, update: async (u) => (slotLog.push(["update", u]), true) }
    ] } };
  caster.items = { get: (id) => (id === "s1" ? { name: "Heal" } : caster.itemTypes.spellcastingEntry.find((e) => e.id === id)) };
  globalThis.fromUuidSync = (uuid) => (uuid === "mystic" ? caster : null);
  let pickSlot = "sp1|2|-1";
  globalThis.foundry.applications.api.DialogV2.wait = async ({ buttons }) => buttons[0].callback({}, { form: { elements: { slot: { value: pickSlot }, actions: { value: "3" } } } });
  globalThis.ui = { notifications: { warn: (m) => slotLog.push(["warn", m]), info: () => {} } };
  damageFormulas.length = 0;
  const bombard = { dataset: { spell: "503", station: "3" } };
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.castSpell.call(sheet, {}, bombard);
  check("Bombardment with a spontaneous rank 2 slot: slot count 2 → 1, cast at rank 2", [slotLog[0], damageFormulas[0]], [["update", { "system.slots.slot2.value": 1 }], "{(3d4+3)[force]}"]);
  pickSlot = "p1|1|0";
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.castSpell.call(sheet, {}, bombard);
  check("Bombardment with a prepared rank 1 spell: that prepared slot is marked expended", slotLog[1], ["expend", 1, 0, true]);
  const noSlots = { name: "Grix", uuid: "mystic", level: 6, itemTypes: { spellcastingEntry: [] }, items: { get: () => null } };
  globalThis.fromUuidSync = () => noSlots;
  slotLog.length = 0;
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.castSpell.call(sheet, {}, bombard);
  check("No slots left: nothing is cast", [slotLog[0]?.[0], slotLog[0]?.[1]?.includes("no unused spell slots")], ["warn", true]);

  // Mystic vitality network → Transmute Vitality heals the ship
  const L4 = await import("../sf2e-starship-sheets/scripts/logic.mjs");
  check("Transfer Vitality cap by level 1/5/10/20", [1, 5, 10, 20].map(L4.vitalityTransferCap), [10, 20, 30, 50]);
  check("Network regain: trained/expert 4, master 6, legendary 8", [1, 2, 3, 4].map(L4.vitalityRegen), [4, 4, 6, 8]);
  const vitRow = [...document.querySelectorAll("#pc .sss-conduit li.sss-action")].find((li) => li.textContent.includes("Transmute Vitality"));
  check("Conduit shows the network and Heal ship (missing 6 HP of 72/78)", [vitRow.querySelector(".sss-trait").textContent, vitRow.querySelector('[data-action="transmuteVitality"]').textContent.trim(), vitRow.querySelector('[data-action="vitalityRegen"]').textContent.trim()],
    ["Network 18/30", "Heal ship +6", "Regain +4"]);
  const res = [];
  const docUpd = [];
  const vitActor = { name: "Vesk", uuid: "mystic", level: 6, getResource: () => ({ value: 18, max: 30 }), updateResource: async (k, v) => res.push([k, v]),
    itemTypes: { spellcastingEntry: [{ statistic: { rank: 3, check: { mod: 14 } } }] } };
  globalThis.fromUuidSync = (uuid) => (uuid === "mystic" ? vitActor : null);
  const vitShip = structuredClone(ship);
  const vitSheet = new main.PCStarshipSheet();
  vitSheet.document = { ...shipActor, flags: { "sf2e-starship-sheets": { ship: vitShip } }, system: { attributes: { hp: { value: 60, max: 78 } } }, update: async (u) => docUpd.push(u) };
  globalThis.foundry.applications.api.DialogV2.wait = async ({ buttons }) => buttons[0].callback({}, { form: { elements: { amount: { value: "15" } } } });
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.transmuteVitality.call(vitSheet, {}, { dataset: { station: "3" } });
  check("Transmute Vitality 15: network 18 → 3, hull 60 → 75", [res[0], docUpd[0]?.["system.attributes.hp.value"]], [["vitality-network", 3], 75]);
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.vitalityRegen.call(vitSheet, {}, { dataset: { station: "3" } });
  check("Regain at master spell DC: +6 (18 → 24)", res[1], ["vitality-network", 24]);
} catch (err) {
  document.getElementById("results").innerHTML += `\n<span class="fail">FAIL</span> main.mjs: ${err.stack}`;
}
window.__done = true;
</script>
