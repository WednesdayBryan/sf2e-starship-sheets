<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Starship Sheets Test</title>
<link rel="stylesheet" href="../sf2e-starship-sheets/styles/starship.css">
<style>
  body { background: #222; color: #ddd; font-family: sans-serif; margin: 0; padding: 12px; }
  #results { font-family: monospace; white-space: pre-wrap; background: #111; padding: 8px; margin-bottom: 12px; }
  .pass { color: #6f6; } .fail { color: #f66; font-weight: bold; }
  .frame { width: 900px; margin-bottom: 20px; border: 1px solid #555; }
  .action-glyph { font-family: monospace; border: 1px solid #888; padding: 0 2px; font-size: 10px; }
</style>
</head>
<body>
<div id="results"></div>
<div class="sf2e-starship-sheets frame" id="pc"><div class="window-content"></div></div>
<div class="sf2e-starship-sheets frame" id="npc"><div class="window-content"></div></div>
<script type="module">
import { defaultPCShip, derivePCShip, applyShipDamage, applyHullRepair, hullIntegrity, generateShieldsDice, ventPowerDice, vehicleSync, cosmicSpell, cantripRank } from "../sf2e-starship-sheets/scripts/logic.mjs";
import { renderPCSheet, renderNPCSheet } from "../sf2e-starship-sheets/scripts/render.mjs";

const out = [];
let failures = 0;
const eq = (label, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) failures++;
  out.push(`<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${label}: got ${JSON.stringify(got)}${ok ? "" : `, want ${JSON.stringify(want)}`}`);
};

// The group's ship from the AoN builder link: level 6 Skirmisher.
const ship = defaultPCShip("skirmisher", 6);
const set = (i, props) => Object.assign(ship.stations[i], props);
set(0, { upgrades: ["powerful-thrusters", "ramming-prow"], helmer: "pilot" });
set(1, { upgrades: ["primal-shielding", "mechanic-generator-module"] });
set(2, { type: "gunnery", upgrades: ["starship-weapon-crystal", "secondary-armaments"], weapons: [{ key: "farseeker-missiles" }, { key: "light-laser-cannon" }], helmer: "gunner" });
set(3, { type: "conduit", upgrades: ["mystic-magic-module", "witchwarper-magic-module"], helmer: "mystic" });
set(4, { type: "scanners", upgrades: ["communications-overlay", "security-relay"], helmer: "scanner" });
set(5, { type: "gunnery", upgrades: ["secondary-armaments", "munitions-deflection-unit"], weapons: [{ key: "light-laser-cannon" }, { key: "chain-repeater" }] });
ship.bays[0] = { name: "Medical Bay", notes: "Treat Wounds +1" };

const crew = {
  pilot: { name: "Asha (pilot)", pilotDC: 24, dex: 4, level: 6, ranks: { simple: 1, martial: 1, advanced: 0 } },
  gunner: { name: "Grix (gunner)", pilotDC: 18, dex: 4, level: 6, str: 4, ranks: { simple: 2, martial: 1, advanced: 0 },
    solarWeapon: { label: "Solar Weapon", variants: ["+14", "+9", "+4"] }, solarFlare: { attack: 12, dice: 1, die: "d6", type: "fire" } },
  scanner: { name: "Zo (scanners)", pilotDC: 15, dex: 2, level: 6, ranks: { simple: 1, martial: 0, advanced: 0 } },
  mystic: { name: "Vesk (mystic)", pilotDC: 12, dex: 1, level: 6, spellAttack: 14, ranks: { simple: 1, martial: 0, advanced: 0 } }
};

eq("Cantrip rank at level 6", cantripRank(6), 3);
eq("Cosmic Cannon rank 1 / 3", [cosmicSpell(504, 1).formula, cosmicSpell(504, 3).formula], ["2d4", "4d4"]);
eq("Cosmic Bombardment rank 1, 3 actions", cosmicSpell(503, 1, 3).formula, "3d4+3");
eq("Cosmic Bombardment rank 3, 2 actions (2 missiles per action)", cosmicSpell(503, 3, 2).formula, "4d4+4");
eq("Cosmic Fortification rank 2", cosmicSpell(505, 2).formula, "2d4+8");
eq("Cosmic Repairs rank 3", cosmicSpell(506, 3).formula, "3d8+24");

// Unhelmed: must match the AoN builder exactly.
const bare = structuredClone(ship);
bare.stations.forEach((s) => (s.helmer = ""));
const b = derivePCShip(bare, {});
eq("Frame HP", b.hpMax, 78);
eq("Frame SP", b.spMax, 34);
eq("AC unhelmed", b.ac.total, 22);
eq("Saves unhelmed", [b.saves.fortitude.total, b.saves.reflex.total, b.saves.will.total], [14, 15, 14]);
eq("Speed", b.speed, 5);
eq("Sensor range (4 + advanced scanners 2)", b.sensor.total, 6);
eq("Station grades", b.stations.map((s) => s.gradeLabel), ["Advanced", "Advanced", "Advanced", "Advanced", "Advanced", "Advanced"]);
eq("Pilot upgrades allowed", b.stations[0].upgradesAllowed, 2);
eq("No warnings", b.warnings, []);
eq("Gunnery weapon formulas", b.stations[2].weaponsView.map((w) => w.formula), ["2d8", "2d8"]);
eq("Tracking", b.stations[2].weaponsView[0].tracking, 1);
eq("Pilot actions (no Jump Start)", b.stations[0].actions.map((a) => a.name), ["Boost Thrusters", "Change Heading", "Evade", "Juke", "Stick To Cover", "Clear A Path", "Smoke And Mirrors", "Uncanny Turn", "Overload Thrusters", "Ram", "Repair Station"]);
const act = (si, name) => b.stations[si].actions.find((a) => a.name === name)?.check;
eq("Juke: Piloting vs Perception DC", act(0, "Juke"), { skills: ["piloting"], vs: "perception", dc: null, secret: false });
eq("Ram: target Fortitude vs Piloting DC", act(0, "Ram"), { save: "fortitude", basic: true, dcSkill: "piloting", dcClass: false });
eq("Jump Start at generator: Crafting DC 15", act(1, "Jump Start"), { skills: ["crafting"], dc: 15, vs: null, secret: false });
eq("Jump Start at conduit: four skills", act(3, "Jump Start").skills, ["arcana", "occultism", "nature", "religion"]);
eq("Scan Target: Computers vs Will DC", act(4, "Scan Target"), { skills: ["computers"], vs: "will", dc: null, secret: false });
eq("Seek Starships is secret", act(4, "Seek Starships").secret, true);
eq("Target Lock: target Will vs Computers DC", act(4, "Target Lock").save, "will");
eq("Lock On has no roll", act(2, "Lock On"), null);
eq("Repair Drone's Repair Hull: Crafting DC 15", b.stations.length && derivePCShip({ ...bare, stations: [...bare.stations.slice(0, 5), { ...bare.stations[5], type: "drone", upgrades: [], weapons: [] }] }, {}).stations[5].drones[1].actionList[0].check.dc, 15);
eq("Generator actions", b.stations[1].actions.map((a) => a.name), ["Boost Battle Station", "Generate Shields", "Reposition Shield", "Vent Power", "Shielding Foliage", "Modify Starship", "Jump Start", "Repair Station"]);
eq("Gunnery 1 actions", b.stations[2].actions.map((a) => a.name), ["Lock On", "Target Battle Station", "Nova Weapon", "Nova Strike", "Nova Blast", "Nova Surge", "Repair Station", "Area Fire"]);
eq("Gunnery 2 actions include Deflect Munitions and Auto-Fire", ["Deflect Munitions", "Auto-Fire"].every((n) => b.stations[5].actions.some((a) => a.name === n)), true);
eq("Scanner actions", b.stations[4].actions.map((a) => a.name), ["Hack Comms", "Seek Starships", "Target Lock", "Hack Battle Station", "Scan Target", "Hack Munition", "Security Scan", "Jump Start", "Repair Station"]);

// Helmed
const d = derivePCShip(ship, crew);
eq("AC with pilot DC 24 + advanced helm +1", d.ac.total, 25);
eq("Reflex with advanced pilot (+0)", d.saves.reflex.total, 15);
eq("Gunner attack: dex 4 + martial trained (6+2) + tracking 1", d.stations[2].weaponsView[0].attack, 13);
eq("Laser (simple, expert): 4 + 6 + 4 + 1", d.stations[2].weaponsView[1].attack, 15);
eq("Unhelmed gunnery has no attack", d.stations[5].weaponsView[0].attack, null);
eq("Chain repeater MAP", d.stations[5].weaponsView[1].map, [0, -5, -10]);

// Damage rules
let s = { hp: 78, hpMax: 78, sp: 34, compromised: 0, wrecked: 0, destroyed: false };
let r = applyShipDamage(s, { amount: 40 });
eq("40 damage: SP 0, HP 72", [r.sp, r.hp, r.compromised], [0, 72, 0]);
r = applyShipDamage({ ...s, sp: 10 }, { amount: 30, bypass: true });
eq("Bypassing skips shields", [r.sp, r.hp], [10, 48]);
r = applyShipDamage({ ...s, hp: 10, sp: 0, wrecked: 1 }, { amount: 50 });
eq("Drop to 0 while wrecked 1: compromised 2, stations malfunction", [r.hp, r.compromised, r.malfunctionAll], [0, 2, true]);
r = applyShipDamage({ ...s, hp: 10, sp: 0 }, { amount: 50, critical: true });
eq("Crit to 0: compromised 2", r.compromised, 2);
r = applyShipDamage({ ...s, hp: 0, sp: 0, compromised: 3 }, { amount: 5 });
eq("Damage while compromised: +1", r.compromised, 4);
r = applyShipDamage({ ...s, hp: 0, sp: 0, compromised: 9 }, { amount: 5, critical: true });
eq("Compromised 10 destroys", [r.compromised, r.destroyed], [10, true]);
r = applyHullRepair({ ...s, hp: 0, compromised: 4, wrecked: 1 }, 5);
eq("Repair from 0: compromised ends, wrecked 2", [r.hp, r.compromised, r.wrecked], [5, 0, 2]);
eq("Hull integrity nat 20 at compromised 3", hullIntegrity(3, 20).compromised, 1);
eq("Hull integrity 13 at compromised 3 (success)", hullIntegrity(3, 13).compromised, 2);
eq("Hull integrity 5 at compromised 3 (failure)", hullIntegrity(3, 5).compromised, 4);
eq("Hull integrity 1 at compromised 3 (crit fail)", hullIntegrity(3, 1).compromised, 5);
eq("Generate Shields dice by level 1/3/6/20", [1, 3, 6, 20].map(generateShieldsDice), [1, 2, 3, 10]);
eq("Vent Power dice by level 5/6/8", [5, 6, 8].map(ventPowerDice), [1, 2, 3]);
eq("Vehicle sync", vehicleSync(d, 90), {
  "system.details.level.value": 6, "system.attributes.hp.max": 78, "system.attributes.hp.value": 78,
  "system.attributes.ac.value": 25, "system.saves.fortitude.value": 14, "system.details.speed": "5 zones", "system.traits.size.value": "med"
});

// Warnings
const bad = structuredClone(bare);
bad.stations[0].upgrades.push("solar-thrusters");
bad.stations[1].upgrades.push("coilgun");
eq("Too many upgrades warns", derivePCShip(bad, {}).warnings.some((w) => w.includes("3 upgrades")), true);

out.unshift(failures ? `<span class="fail">${failures} FAILED</span>` : `<span class="pass">ALL PASSED</span>`);
document.getElementById("results").innerHTML = out.join("\n");

// Render the PC sheet
document.querySelector("#pc .window-content").innerHTML = renderPCSheet({
  name: "The Starfinder Skirmisher", img: "", editable: true, ship, derived: d,
  hp: { value: 72, max: 78 }, hpField: "system.attributes.hp.value",
  crewOptions: Object.entries(crew).map(([uuid, c]) => ({ uuid, name: c.name })), tab: "stations"
});

// Render an NPC sheet (Sword-class Attack Vessel)
const npcShip = { kind: "npc", sp: 6, spMax: 6, fortify: 5, sensor: 4, speed: 4, compromised: 0, wrecked: 0, destroyed: false, heading: "west", notes: "",
  stations: [{ type: "gunnery", name: "coilgun, light laser cannon", malfunctioning: false }, { type: "pilot", name: "Ambush from Hell, Boost Thrusters, Change Heading, ramming prow", malfunctioning: true }] };
document.querySelector("#npc .window-content").innerHTML = renderNPCSheet({
  name: "Sword-class Attack Vessel", img: "", editable: true, isGM: true, ship: npcShip, level: 2, size: "Medium", traits: ["Tech"],
  ac: 17, pilotingDC: 17, saves: { fortitude: 9, reflex: 9, will: 5 }, perception: 7,
  skills: [{ slug: "computers", label: "Computers", mod: 7 }, { slug: "intimidation", label: "Intimidation", mod: 8 }, { slug: "piloting", label: "Piloting", mod: 7 }],
  abilities: [["Str", 1], ["Dex", 3], ["Con", 2], ["Int", 3], ["Wis", 1], ["Cha", 2]].map(([label, mod]) => ({ label, mod })),
  immunities: "starship immunities", resistances: "piercing 4", weaknesses: "",
  hp: { value: 30, max: 30 }, hpField: "system.attributes.hp.value",
  strikes: [
    { index: 0, label: "Ramming Prow", kind: "Melee", variants: ["+9", "+4", "-1"], damage: "1d6+3 piercing", traits: ["Analog"] },
    { index: 1, label: "Coilgun", kind: "Ranged", variants: ["+11", "+7", "+3"], damage: "1d6+3 piercing", traits: ["Agile", "Analog", "Range increment 3 zones"] }
  ],
  actions: [
    { id: "a1", name: "Ambush from Hell", cost: 2, traits: [], station: "pilot" },
    { id: "a2", name: "Engaged Strike", cost: "r", traits: [], station: "gunnery" },
    { id: "a3", name: "Repair Self", cost: 1, traits: [], station: "other" }
  ],
  tab: "combat"
});

// Load main.mjs against minimal Foundry stand-ins: proves it parses and registers.
const registered = [];
globalThis.foundry = {
  applications: {
    sheets: { ActorSheetV2: class {} },
    api: { DialogV2: {}, ApplicationV2: class {} },
    apps: { DocumentSheetConfig: { registerSheet: (...a) => registered.push(a[3].label) } },
    instances: new Map()
  },
  utils: { deepClone: (o) => structuredClone(o), mergeObject: Object.assign, setProperty() {}, getProperty() {}, expandObject: (o) => o }
};
const hooks = {};
globalThis.Hooks = { once: (n, f) => (hooks[n] = f), on: () => {} };
globalThis.game = { system: { id: "sf2e" }, settings: { register() {} }, modules: new Map([["sf2e-starship-sheets", {}]]) };
globalThis.Actor = class {};
try {
  const main = await import("../sf2e-starship-sheets/scripts/main.mjs");
  hooks.init();
  document.getElementById("results").innerHTML += `\n<span class="pass">PASS</span> main.mjs loaded and registered: ${registered.join(", ")}`;

  // Portrait / token image updates
  const tokenUpdates = [];
  globalThis.canvas = { scene: { tokens: [{ id: "t1", actorId: "a1", actorLink: true, isOwner: true }, { id: "t2", actorId: "other", actorLink: true, isOwner: true }],
    updateEmbeddedDocuments: async (type, u) => tokenUpdates.push(...u) } };
  const mockActor = (img, tokenSrc) => ({ id: "a1", img, prototypeToken: { actorLink: true, texture: { src: tokenSrc } }, updates: [], async update(u) { this.updates.push(u); } });
  const check = (label, got, want) => {
    const ok = JSON.stringify(got) === JSON.stringify(want);
    document.getElementById("results").innerHTML += `\n<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${label}: got ${JSON.stringify(got)}${ok ? "" : `, want ${JSON.stringify(want)}`}`;
  };
  let a = mockActor("icons/svg/target.svg", "icons/svg/target.svg");
  await main.setImage(a, "ships/skirmisher.webp", "img");
  check("Portrait also sets matching token + placed token", [a.updates[0], tokenUpdates], [{ img: "ships/skirmisher.webp", "prototypeToken.texture.src": "ships/skirmisher.webp" }, [{ _id: "t1", "texture.src": "ships/skirmisher.webp" }]]);
  a = mockActor("ships/old.webp", "tokens/custom.webp");
  tokenUpdates.length = 0;
  await main.setImage(a, "ships/new.webp", "img");
  check("Portrait leaves a custom token alone", [a.updates[0], tokenUpdates.length], [{ img: "ships/new.webp" }, 0]);
  await main.setImage(a, "tokens/top-down.webp", "token");
  check("Token button sets only the token", a.updates[1], { "prototypeToken.texture.src": "tokens/top-down.webp" });
  check("Token button is rendered", !!document.querySelector('#pc [data-action="editToken"]'), true);
  const rollBtns = [...document.querySelectorAll('#pc [data-action="rollActionCheck"]')].map((el) => `${el.closest("li").querySelector(".sss-action-name").textContent.trim().replace(/^\S+\s*/, "")}:${el.dataset.skill}`);
  check("Scanner roll buttons", rollBtns.filter((t) => /Scan Target|Hack Battle|Seek/.test(t)), ["Seek Starships:computers", "Seek Starships:perception", "Hack Battle Station:computers", "Scan Target:computers"]);
  check("Juke roll button", rollBtns.includes("Juke:piloting"), true);
  check("Target Lock shows a Will DC button", [...document.querySelectorAll('#pc .sss-roll[data-action="postAction"]')].some((el) => el.textContent.includes("Will DC")), true);

  // Clicking a roll button rolls the helmer's own skill against the targeted ship's DC.
  const rolls = [];
  const helmer = { name: "Zo", skills: { computers: { roll: async (p) => rolls.push(p) } } };
  const shipActor = { type: "vehicle", name: "Test Ship", flags: { "sf2e-starship-sheets": { ship } }, system: { attributes: { hp: { value: 78, max: 78 } } } };
  globalThis.fromUuidSync = (uuid) => (uuid === "scanner" ? helmer : null);
  globalThis.game.user = { targets: new Set([{ actor: { type: "npc", name: "Raider", saves: { will: { dc: { value: 18 } } } } }]), character: null };
  globalThis.ui = { notifications: { warn: (m) => rolls.push({ warn: m }), info: () => {} } };
  globalThis.foundry.utils.mergeObject = (a, b) => ({ ...a, ...b });
  const sheet = new main.PCStarshipSheet();
  sheet.document = shipActor;
  const btn = document.querySelector('#pc [data-action="rollActionCheck"][data-skill="computers"]');
  const scanBtn = [...document.querySelectorAll('#pc [data-action="rollActionCheck"]')].find((el) => el.closest("li").textContent.includes("Scan Target"));
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.rollActionCheck.call(sheet, {}, scanBtn);
  check("Scan Target rolls Zo's Computers vs target's Will DC 18", rolls[0], { event: {}, label: "Scan Target (Computers)", dc: { value: 18, label: "Raider's Will DC" } });

  // Cosmic Cannon spell attacks
  const conduit = document.querySelector("#pc .sss-conduit");
  check("Cosmic Cannon attack buttons", [...conduit.querySelectorAll('[data-action="spellAttack"]')].map((b) => b.textContent), ["+14", "+9", "+4"]);
  check("Cosmic Cannon damage button", conduit.querySelector('[data-action="spellDamage"]').textContent.trim(), "4d4 force");
  check("Other spells have Cast", [...conduit.querySelectorAll('[data-action="castSpell"]')].map((b) => b.dataset.spell), ["503", "505", "506"]);
  const spellRolls = [];
  const mystic = { name: "Vesk", level: 6, itemTypes: { spellcastingEntry: [{ statistic: { check: { mod: 14 }, roll: async (p) => spellRolls.push(p) } }] } };
  globalThis.fromUuidSync = (uuid) => (uuid === "mystic" ? mystic : uuid === "scanner" ? helmer : null);
  globalThis.game.pf2e = { Modifier: class { constructor(d) { Object.assign(this, d); } } };
  globalThis.game.user.targets = new Set([{ actor: { type: "npc", name: "Raider", attributes: { ac: { value: 20 } } } }]);
  const mapBtn = conduit.querySelectorAll('[data-action="spellAttack"]')[1];
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.spellAttack.call(sheet, {}, mapBtn);
  // Starship Weapon Crystal: solar weapon and solar flare
  const gunnery = document.querySelector("#pc .sss-gunnery");
  const row = (name) => [...gunnery.querySelectorAll("li.sss-action")].find((li) => li.querySelector(".sss-action-name").textContent.includes(name));
  check("Nova Strike buttons from solar weapon", [...row("Nova Strike").querySelectorAll('[data-action="novaStrike"]')].map((b) => b.textContent), ["+14", "+9", "+4"]);
  check("Nova Surge has one Strike (no MAP)", [...row("Nova Surge").querySelectorAll('[data-action="novaStrike"]')].map((b) => b.textContent), ["+14"]);
  check("Nova Blast buttons and damage", [[...row("Nova Blast").querySelectorAll('[data-action="novaBlast"]')].map((b) => b.textContent), row("Nova Blast").querySelector('[data-action="novaBlastDamage"]').textContent.trim()],
    [["+12", "+7", "+2"], "1d6+4 fire"]);
  const strikeRolls = [];
  const solarian = { name: "Grix", uuid: "gunner", system: { abilities: { str: { mod: 4 } }, actions: [
    { type: "strike", slug: "fist" },
    { type: "strike", slug: "solar-weapon", label: "Solar Weapon", variants: [0, 1, 2].map((n) => ({ label: `v${n}`, roll: async () => strikeRolls.push(`weapon v${n}`) })), damage: async () => strikeRolls.push("weapon damage") },
    { type: "strike", slug: "solar-flare", totalModifier: 12, item: { system: { damage: { dice: 1, die: "d6", damageType: "fire" } } }, variants: [] }
  ] } };
  globalThis.fromUuidSync = (uuid) => (uuid === "gunner" ? solarian : uuid === "mystic" ? mystic : null);
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.novaStrike.call(sheet, {}, row("Nova Strike").querySelectorAll('[data-action="novaStrike"]')[1]);
  await main.PCStarshipSheet.DEFAULT_OPTIONS.actions.novaDamage.call(sheet, {}, row("Nova Strike").querySelector('[data-action="novaDamage"]'));
  check("Nova Strike rolls the solar weapon's 2nd attack, then its damage", strikeRolls, ["weapon v1", "weapon damage"]);
  check("Nova Blast formula with Str +4 / -1", [main.PCStarshipSheet && (await import("../sf2e-starship-sheets/scripts/logic.mjs")).novaBlastFormula({ dice: 1, die: "d8" }, 4), (await import("../sf2e-starship-sheets/scripts/logic.mjs")).novaBlastFormula({ dice: 1, die: "d6" }, -1)], ["1d8+4", "1d6-1"]);
  check("Spell attack rolls caster's spellcasting vs target AC 20 with MAP -5", { label: spellRolls[0].label, dc: spellRolls[0].dc, map: spellRolls[0].modifiers?.[0]?.modifier },
    { label: "Cosmic Cannon: spell attack (MAP -5)", dc: { value: 20, label: "Raider's AC" }, map: -5 });
} catch (err) {
  document.getElementById("results").innerHTML += `\n<span class="fail">FAIL</span> main.mjs: ${err.stack}`;
}
window.__done = true;
</script>
</body>
</html>
